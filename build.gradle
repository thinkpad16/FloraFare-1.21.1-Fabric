plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// AppleSkin (optional integration)
	maven { url "https://maven.ryanliptak.com/" }
	// Cloth Config (only needed for the commented-out AppleSkin dev-runtime testing below)
	maven { url "https://maven.shedaniel.me/" }
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// AppleSkin: compile-only so the dev client doesn't try to load it (it needs
	// Cloth Config at runtime, which we don't provide). At distribution time it stays
	// optional — our integration class is only loaded via AppleSkin's own "appleskin"
	// entrypoint, which only fires when AppleSkin is installed.
	modCompileOnly "squeek.appleskin:appleskin-fabric:${project.appleskin_version}"
	// To test the AppleSkin integration in the dev client, uncomment these two lines:
	//modLocalRuntime "squeek.appleskin:appleskin-fabric:${project.appleskin_version}"
	//modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}
