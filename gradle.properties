org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

org.gradle.configuration-cache=false


minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.2
# Pinned to a release, not 1.17-SNAPSHOT: a snapshot is republished in place, so the
# same commit could build against different Loom versions on different days — and a CI
# failure from that looks like a code problem rather than a toolchain one.
loom_version=1.17.20

mod_version=1.4.0
maven_group=net.tend1tnuy.florafare

fabric_api_version=0.116.12+1.21.1

# Optional integration: AppleSkin (hunger/saturation tooltip & HUD)
appleskin_version=mc1.21-3.0.6

# Optional integration: EMI (recipe viewer — buff & synergy categories)
emi_version=1.1.24+1.21.1

# ModMenu config screen (Cloth Config bundled via jar-in-jar; ModMenu itself optional)
cloth_config_version=15.0.127
modmenu_version=11.0.1

# MixinExtras: @WrapOperation in PlayerEntityMixin. Fabric Loader bundles it (this is
# the exact build Loader 0.19.2 ships), so it is compileOnly here and never bundled by
# us. Keep at or below the version the supported Loader range provides.
mixinextras_version=0.5.4

# Unit tests
junit_version=5.11.3
